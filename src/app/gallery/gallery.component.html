<section class="album" aria-labelledby="galeria-titol">

  <div class="album__grid">

    <figure class="polaroid polaroid--hero">

      <figcaption class="polaroid__caption">

    <figure class="polaroid">

    <figure class="polaroid">
      <div class="polaroid__photo">
