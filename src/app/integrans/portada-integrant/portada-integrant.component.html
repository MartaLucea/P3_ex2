@if (!selected()) {
<button
    onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
    type="button"
    [class.active]="selected()"
    (click)="onSelectIntegrant()"
    class="card">
    <div class="card__photo">
        <app-image
            class="card__img"
            [nom]="'integrants/'+integrant().foto",
            ample="600",
            altura="300"
            [alt]="'Foto de ' + integrant().nom",
            loading="lazy"
        />
    </div>

    <div aria-hidden="true" class="card__overlay"></div>

    <span class="card__id">
        0{{ integrant().id }}
    </span>

    <div class="card__footer">
        <p class="nombre card__name">{{ integrant().nom }}</p>
        <span class="card__cta">Veure perfil →</span>
    </div>
</button>
}
