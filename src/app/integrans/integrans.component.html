<h2> Membres BTS </h2>

<ul>
    @for (integrant of integrants; track integrant.id) {
        <li >
        <app-portada-integrant 
            [integrant]="integrant"
            [selected]="integrant === selectedIntegrant"
            (select)="onSelectIntegrant($event)" />
        </li>
    }
    @if (selectedIntegrant) {
        <app-info-integrant [integrant]="selectedIntegrant" />
    }
</ul>
