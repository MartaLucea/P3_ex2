<section class="members-page">

  <header class="members-page__header">
    <p class="kicker">Bangtan Sonyeondan</p>
    <h2 class="members-page__title">
      Membres <span class="text-gradient">BTS</span>
    </h2>
    <p class="members-page__lead">Tria un membre i descobreix la seva història.</p>
  </header>

  @if (selectedIntegrant) {
    <app-info-integrant class="members-page__selected" [integrant]="selectedIntegrant" />
  }

  <ul class="members-page__grid">
    @for (integrant of integrants; track integrant.id) {
      @if (integrant !== selectedIntegrant) {
        <li>
          <app-portada-integrant
              class="members-page__card"
              [integrant]="integrant"
              [selected]="false"
              (select)="onSelectIntegrant($event)" />
        </li>
      }
    }
  </ul>
</section>
