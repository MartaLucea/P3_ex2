@if (integrant) {
<article class="profile">
  <div aria-hidden="true" class="profile__glow profile__glow--violet"></div>
  <div aria-hidden="true" class="profile__glow profile__glow--album"></div>

  <div class="profile__top">

    <div class="player">

      <div class="player__disc">
        <div class="vinyl player__vinyl">
          <app-image
            class="player__cover"
            [nom]="'discos/'+integrant.portadaAlbumFamoso"
            ample="100"
            [alt]="'Portada del album ' + integrant.infoAlbum.nom"/>
          <span aria-hidden="true" class="player__hole"></span>
        </div>
      </div>

      <div class="player__info">
        <p class="kicker">Ara sona</p>
        <p class="player__title">{{ integrant.infoAlbum.nom }}</p>
      </div>

      <app-audio-player [nom]="integrant.album"/>
    </div>

    <div class="profile__main">

      <section class="bio">
        <div class="bio__photo">
          <app-image
            class="bio__img"
            [nom]="'integrants/'+integrant.foto"
            ample="600"
            [alt]="'Foto de ' + integrant.nom"/>
          <div aria-hidden="true" class="bio__fade"></div>
        </div>

        <div class="bio__body">
          <p class="bio__aliases">
            @for (alias of integrant.nomArtistic; track alias) {
              @if ($first) {
                <span class="bio__alias bio__alias--main">{{ alias }}</span>
              } @else {
                <span class="bio__alias">{{ alias }}</span>
              }
            }
          </p>
          <h2 class="bio__name">{{ integrant.nom }}</h2>
          <p class="bio__text">{{ integrant.biografia }}</p>
        </div>
      </section>
    </div>
  </div>

  <section class="profile__media">

    <div class="video">
      <app-video-player [nom]="integrant.videoMusical"/>
    </div>

    <div class="featured">
      <h2 class="kicker featured__title">Àlbum més famós</h2>

      <div id="info-album" class="featured__content">
        <div class="featured__info">
          <h3 class="featured__name">{{ integrant.infoAlbum.nom }}</h3>
          <p class="featured__year text-gradient">{{ integrant.infoAlbum.any }}</p>
        </div>

        <div class="featured__cover">
          <app-image
            class="featured__img"
            [nom]="'discos/'+integrant.portadaAlbumFamoso"
            ample="200"
            [alt]="'Portada álbum ' + integrant.infoAlbum.nom"/>
        </div>
      </div>
    </div>

  </section>
</article>
}
