@if (integrant) {
<article class="relative isolate">
    <div aria-hidden="true" class="pointer-events-none absolute -top-24 -left-24 -z-10 size-96 rounded-full bg-violet-600/25 blur-[110px]"></div>
    <div aria-hidden="true" class="pointer-events-none absolute -right-20 bottom-0 -z-10 size-80 rounded-full bg-fuchsia-600/15 blur-[110px]"></div>

    <div class="grid gap-8 lg:grid-cols-12">

        <div class='vinilo flex flex-col items-center gap-6 rounded-[2rem] border border-white/10 bg-white/4 p-7 backdrop-blur lg:col-span-4 lg:self-start'>
            <div class="relative aspect-square w-full max-w-xs">
                <div class="vinyl absolute inset-0 rounded-full shadow-2xl shadow-violet-900/70 motion-safe:animate-[spin_14s_linear_infinite]">
                    <img
                        class="absolute top-[31%] left-[31%] size-[38%] rounded-full object-cover ring-4 ring-night-950"
                        [src]="integrant.portadaAlbumFamoso"
                        [alt]="'Portada del album ' + integrant.infoAlbum.nom">
                    <span aria-hidden="true" class="absolute top-1/2 left-1/2 size-3 -translate-x-1/2 -translate-y-1/2 rounded-full bg-night-950 ring-2 ring-violet-400/40"></span>
                </div>
            </div>

            <div class="w-full text-center">
                <p class="kicker mb-1">Ara sona</p>
                <p class="font-display text-lg font-bold text-white">{{ integrant.infoAlbum.nom }}</p>
            </div>

            <audio class='audio w-full' controls>
                <source [src]="integrant.musica" type='audio/mpeg'>
            </audio>
        </div>

        <div class='principal flex flex-col gap-8 lg:col-span-8'>

            <section class='tarjeta overflow-hidden rounded-[2rem] border border-white/10 bg-night-800/80 shadow-2xl shadow-black/40 sm:grid sm:grid-cols-5'>
                <div class='img relative min-h-80 sm:col-span-2'>
                    <img
                        class="absolute inset-0 size-full object-cover object-top"
                        [src]="integrant.foto"
                        [alt]="'Foto de ' + integrant.nom">
                    <div aria-hidden="true" class="absolute inset-0 bg-linear-to-t from-night-800 via-transparent to-transparent sm:bg-linear-to-r sm:from-transparent sm:via-transparent sm:to-night-800"></div>
                </div>

                <div class='tarjeta-contenido p-7 sm:col-span-3 sm:p-9'>
                    <p class="mb-4 flex flex-wrap gap-2">
                        @for (alias of integrant.nomArtistic; track alias) {
                            @if ($first) {
                                <span class="rounded-full bg-linear-to-r from-violet-500 to-fuchsia-500 px-3 py-1 text-xs font-semibold tracking-wider text-white shadow-lg shadow-violet-600/40">{{ alias }}</span>
                            } @else {
                                <span class="rounded-full border border-violet-400/30 px-3 py-1 text-xs font-semibold tracking-wider text-violet-200">{{ alias }}</span>
                            }
                        }
                    </p>
                    <h2 class="font-display text-3xl leading-tight font-extrabold text-white sm:text-4xl">{{ integrant.nom }}</h2>
                    <p class="mt-5 leading-7 whitespace-pre-line text-violet-100/75">{{ integrant.biografia }}</p>
                </div>
            </section>

            <div class="aspect-video overflow-hidden rounded-3xl border border-white/10 bg-night-900 shadow-2xl shadow-violet-950/60">
                <iframe
                    class="size-full"
                    [src]="integrant.videoMusical"
                    [title]="'Vídeo musical de ' + integrant.nom"
                    loading="lazy"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <section class='album mt-10 overflow-hidden rounded-[2rem] border border-white/10 bg-linear-to-br from-violet-900/40 via-night-800 to-night-900 p-7 shadow-2xl shadow-black/40 sm:p-10'>
        <h2 class="kicker mb-8">Àlbum més famós</h2>

        <div class="grid items-center gap-10 lg:grid-cols-2">
            <div id='info-album' class="flex flex-col-reverse items-center gap-8 text-center sm:flex-row sm:text-left">
                <div class='info flex-1'>
                    <h3 class="font-display text-3xl leading-tight font-extrabold text-white sm:text-4xl">{{ integrant.infoAlbum.nom }}</h3>
                    <p class="mt-3 font-display text-6xl font-extrabold text-gradient sm:text-7xl">{{ integrant.infoAlbum.any }}</p>
                </div>
                <div class='img w-48 shrink-0 sm:w-56'>
                    <img
                        class="aspect-square w-full rotate-3 rounded-2xl object-cover shadow-2xl shadow-violet-700/50 ring-1 ring-white/15 transition duration-500 hover:rotate-0 hover:scale-105"
                        [src]="integrant.portadaAlbumFamoso"
                        [alt]="'Portada álbum ' + integrant.infoAlbum.nom">
                </div>
            </div>

            <div class="aspect-video overflow-hidden rounded-3xl border border-white/10 bg-night-900 shadow-2xl shadow-violet-950/60">
                <iframe
                    class="size-full"
                    [src]="integrant.albumFamoso"
                    [title]="'Àlbum ' + integrant.infoAlbum.nom"
                    loading="lazy"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </section>
</article>
}
