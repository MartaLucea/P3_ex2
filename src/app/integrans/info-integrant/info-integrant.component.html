<div class='vinilo'>
    <img [src]="integrant.portadaAlbumFamoso" [alt]="'Portada del album' + integrant.infoAlbum.nom">
    <audio class='audio'>
        <source [src]="integrant.musica" type='audio/mpeg'>
    </audio>
</div>

<div class='principal'>
    <section class='tarjeta'>
        <div class='img'>
            <img [src]="integrant.foto" alt="'Foto de ' + integrant.nom">
        </div>

        <div class='tarjeta-contenido'>
            <h3>{{integrant.nomArtistic.join(', ')}}</h3>
            <h1>{{integrant.nom}}</h1>
            <p>{{integrant.biografia}}</p>
        </div>
    </section>

    <iframe width='560' height='315'
        [src]="integrant.videoMusical"
        frameborder='0'
        allowfullscreen>
    </iframe>
</div>


<section class='album'>
    <h1>ÀLBUM MÉS FAMÓS</h1>
    <div id='info-album'>
        <div class='info'>
            <h2>{{integrant.infoAlbum.nom}}</h2>

            <h3>{{integrant.infoAlbum.any}}</h3>
        </div>
        <div class='img'>
            <img [src]="integrant.portadaAlbumFamoso" [alt]="'Portada álbum ' + integrant.infoAlbum.nom">
        </div>
    </div>
    <iframe width='560' height='315'
        [src]="integrant.albumFamoso"
        frameborder='0'
        allowfullscreen>
    </iframe>
</section>
